<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vitalog</title>
<!--PWA-HEAD-START-->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Vitalog">
<meta name="theme-color" content="#F3F6F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1512" media="(prefers-color-scheme: dark)">
<!--PWA-HEAD-END-->
</head>
<body>
<title>Vitalog</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{
  color-scheme:light;
  --bg:#F3F6F4; --surface:#FFFFFF; --surface-2:#E9EFEB; --surface-3:#DDE6E1;
  --ink:#14211C; --ink-2:#4F5F58; --muted:#7E8B85; --line:#DCE4DF;
  --accent:#0F6E5C; --accent-ink:#FFFFFF; --accent-soft:#D9EFE8; --accent-soft-2:#B9E0D4;
  --good:#0ca30c; --good-ink:#006300; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a;
  --grid:#E3E9E5; --axis:#C3CCC6;
  --shadow:0 10px 30px rgba(20,33,28,.12);
  --radius:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0E1512; --surface:#17201B; --surface-2:#1F2A24; --surface-3:#28352E;
    --ink:#EDF3EF; --ink-2:#B5C2BB; --muted:#7F8C86; --line:#2A362F;
    --accent:#4FC3A8; --accent-ink:#06211A; --accent-soft:#173B32; --accent-soft-2:#1F5446;
    --good:#0ca30c; --good-ink:#0ca30c;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70;
    --grid:#263129; --axis:#3A473F;
    --shadow:0 10px 30px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E1512; --surface:#17201B; --surface-2:#1F2A24; --surface-3:#28352E;
  --ink:#EDF3EF; --ink-2:#B5C2BB; --muted:#7F8C86; --line:#2A362F;
  --accent:#4FC3A8; --accent-ink:#06211A; --accent-soft:#173B32; --accent-soft-2:#1F5446;
  --good:#0ca30c; --good-ink:#0ca30c;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70;
  --grid:#263129; --axis:#3A473F;
  --shadow:0 10px 30px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--bg); color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:16px; line-height:1.45;
  -webkit-text-size-adjust:100%;
  -webkit-tap-highlight-color:transparent;
  overscroll-behavior-y:none;
}
h1,h2,h3,.display{
  font-family:"Bricolage Grotesque","IBM Plex Sans",system-ui,sans-serif;
  font-weight:700; letter-spacing:-.01em; text-wrap:balance; margin:0;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible,[tabindex]:focus-visible,summary:focus-visible{
  outline:2px solid var(--accent); outline-offset:2px;
}
a{color:var(--accent)}
p{margin:0}

/* ---------- shell ---------- */
.app{max-width:560px; margin:0 auto; min-height:100%; display:flex; flex-direction:column}
.top{
  position:sticky; top:0; z-index:5;
  background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  padding:calc(env(safe-area-inset-top) + 14px) 20px 10px;
  display:flex; align-items:flex-end; justify-content:space-between; gap:12px;
}
.top h1{font-size:26px;line-height:1.1;font-weight:800}
.eyebrow{font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-2); font-weight:600}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);color:var(--ink-2)}
.iconbtn:active{transform:scale(.96)}
.hdr-actions{display:flex;gap:8px}
main{flex:1; padding:6px 20px calc(env(safe-area-inset-bottom) + 92px)}
.tabs{
  position:fixed; bottom:0; left:0; right:0; z-index:5; margin:0 auto; max-width:560px;
  display:grid; grid-template-columns:repeat(5,1fr);
  background:color-mix(in srgb,var(--surface) 92%,transparent);
  backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
  border-top:1px solid var(--line);
  padding:6px 6px calc(env(safe-area-inset-bottom) + 6px);
}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:12px;color:var(--muted);font-size:11px;font-weight:600;letter-spacing:.02em}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-selected="true"]{color:var(--accent);background:var(--accent-soft)}

/* ---------- blocks ---------- */
.block{margin-top:22px}
.block-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px}
.block-head h2{font-size:18px}
.block-head .more{font-size:13px;font-weight:600;color:var(--accent)}
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius)}
.pad{padding:14px 16px}
.hint{font-size:13px;color:var(--ink-2)}
.hint b{font-weight:600;color:var(--ink)}
.empty{padding:18px 16px; border:1px dashed var(--axis); border-radius:var(--radius); color:var(--ink-2); font-size:14px; text-align:center}
.src{display:inline-block;font-size:10px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);background:var(--surface-2);padding:1px 6px;border-radius:5px;vertical-align:middle}

/* ---------- today tiles ---------- */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px; display:flex;flex-direction:column;gap:4px; min-height:92px;text-align:left}
.tile .lbl{font-size:12px;color:var(--ink-2);font-weight:500;display:flex;justify-content:space-between;gap:6px;align-items:center}
.tile .val{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:26px;line-height:1.05;letter-spacing:-.02em}
.tile .val small{font-size:13px;font-weight:600;color:var(--ink-2);letter-spacing:0;margin-left:3px}
.tile .sub{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;margin-top:auto}
.tile .sub.up{color:var(--good-ink)} .tile .sub.down{color:var(--crit)}
.tile.water{grid-column:1 / -1;flex-direction:row;align-items:center;gap:14px}
.tile.water .val{font-size:22px}
.meter{flex:1;height:10px;border-radius:5px;background:var(--accent-soft);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:5px;transition:width .3s}
.meter.full i{background:var(--good)}
.tile.water .plus{width:44px;height:44px;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:22px;display:grid;place-items:center;flex:none}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:74px;display:flex;flex-direction:column;gap:2px}
.stat .lbl{font-size:11px;color:var(--ink-2);font-weight:500;line-height:1.2}
.stat .val{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:22px;line-height:1.05;letter-spacing:-.02em;margin-top:auto}
.stat .val small{font-size:11px;font-weight:600;color:var(--ink-2);letter-spacing:0;margin-left:2px}
.stat .src{margin-top:4px;align-self:flex-start}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;letter-spacing:.02em;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--ink-2)}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block}
.pill.good{background:color-mix(in srgb,var(--good) 14%,var(--surface));color:var(--good-ink)} .pill.good i{background:var(--good)}
.pill.warn{background:color-mix(in srgb,var(--warn) 20%,var(--surface));color:var(--ink)} .pill.warn i{background:var(--warn)}
.pill.serious{background:color-mix(in srgb,var(--serious) 18%,var(--surface));color:var(--ink)} .pill.serious i{background:var(--serious)}
.pill.crit{background:color-mix(in srgb,var(--crit) 14%,var(--surface));color:var(--crit)} .pill.crit i{background:var(--crit)}

/* ---------- quick log ---------- */
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.qbtn{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px 8px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:11px;font-weight:600;color:var(--ink-2);text-align:center}
.qbtn:active{transform:scale(.97)}
.mono{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:13px;letter-spacing:-.02em;background:var(--accent-soft);color:var(--accent)}
.mono.sm{width:30px;height:30px;font-size:11px;border-radius:8px}

/* ---------- meds ---------- */
.medlist{display:flex;flex-direction:column;gap:8px}
.dose{display:flex;align-items:center;gap:12px;padding:10px 12px 10px 14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;text-align:left;width:100%}
.dose .chk{width:26px;height:26px;border-radius:50%;border:2px solid var(--axis);flex:none;display:grid;place-items:center;color:var(--accent-ink)}
.dose .chk svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.dose.taken .chk{background:var(--accent);border-color:var(--accent)}
.dose.taken .chk svg{opacity:1}
.dose.taken .name{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--axis)}
.dose .txt{flex:1;min-width:0}
.dose .name{font-weight:600;font-size:15px}
.dose .meta{font-size:12px;color:var(--muted)}
.dose .when{font-size:13px;font-weight:600;color:var(--ink-2);font-variant-numeric:tabular-nums}
.dose.due .when{color:var(--crit)}
.medrow{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line)}
.medrow:last-child{border-bottom:0}
.medrow .txt{flex:1;min-width:0}
.medrow .name{font-weight:600}
.medrow .meta{font-size:13px;color:var(--ink-2)}
.medrow .times{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.medrow .times span{font-size:12px;font-variant-numeric:tabular-nums;background:var(--surface-2);padding:1px 7px;border-radius:6px;color:var(--ink-2)}
.medrow.paused .name{color:var(--muted)}
.linkbtn{font-size:13px;font-weight:600;color:var(--accent);padding:6px 8px;border-radius:8px}
.linkbtn.danger{color:var(--crit)}

/* ---------- history ---------- */
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin:0 -20px;padding-left:20px;padding-right:20px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chip{flex:none;padding:6px 12px;border-radius:999px;font-size:13px;font-weight:600;background:var(--surface);border:1px solid var(--line);color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.daygroup{margin-top:18px}
.daygroup h3{font-size:13px;color:var(--ink-2);font-weight:600;letter-spacing:.04em;text-transform:uppercase;margin-bottom:8px;font-family:"IBM Plex Sans",sans-serif}
.entry{display:flex;align-items:center;gap:12px;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:6px}
.entry .txt{flex:1;min-width:0}
.entry .main{font-weight:600;font-size:15px}
.entry .main small{font-weight:500;color:var(--ink-2);font-size:13px}
.entry .note{font-size:13px;color:var(--ink-2);white-space:pre-wrap;overflow-wrap:anywhere}
.entry .time{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.entry .del{color:var(--muted);width:32px;height:32px;border-radius:8px;display:grid;place-items:center}
.entry .del svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.entry .del:hover{color:var(--crit);background:var(--surface-2)}

/* ---------- charts ---------- */
.chart-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 14px 8px;margin-bottom:12px}
.chart-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:6px}
.chart-head h3{font-size:15px}
.chart-head .now{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:20px;letter-spacing:-.02em;line-height:1.1;text-align:right}
.chart-head .now small{font-size:12px;font-weight:600;color:var(--ink-2);letter-spacing:0}
.chart-head .delta{font-size:12px;color:var(--muted);text-align:right}
.chart-head .delta.up{color:var(--good-ink)} .chart-head .delta.down{color:var(--crit)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--ink-2);margin:2px 0 4px;flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:2px;border-radius:1px;display:inline-block}
.chart{position:relative}
.chart svg{width:100%;height:auto;display:block;touch-action:pan-y}
.chart .grid{stroke:var(--grid);stroke-width:1}
.chart .axis{stroke:var(--axis);stroke-width:1}
.chart text{font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:10px;fill:var(--muted);font-variant-numeric:tabular-nums}
.chart .endlbl{fill:var(--ink);font-weight:600;font-size:11px}
.chart .xh{stroke:var(--ink-2);stroke-width:1;opacity:0}
.chart .xh.on{opacity:.7}
.chart .ring{stroke:var(--surface);stroke-width:2}
.chart .band{fill:var(--good);opacity:.06}
.tip{position:absolute;top:4px;left:0;pointer-events:none;opacity:0;transition:opacity .12s;background:var(--ink);color:var(--bg);border-radius:8px;padding:6px 9px;font-size:12px;min-width:96px;box-shadow:var(--shadow);z-index:2}
.tip.on{opacity:1}
.tip .d{color:color-mix(in srgb,var(--bg) 70%,transparent);margin-bottom:2px;font-size:11px}
.tip .r{display:flex;align-items:center;gap:6px;white-space:nowrap}
.tip .r i{width:10px;height:2px;display:inline-block;border-radius:1px}
.tip .r b{font-weight:600}
.tip .r span{opacity:.75}
details.tbl{margin-top:6px}
details.tbl summary{font-size:12px;color:var(--accent);font-weight:600;cursor:pointer;padding:4px 0}
details.tbl table{width:100%;border-collapse:collapse;font-size:13px;margin-top:4px;font-variant-numeric:tabular-nums}
details.tbl td,details.tbl th{padding:4px 6px;border-bottom:1px solid var(--line);text-align:right}
details.tbl td:first-child,details.tbl th:first-child{text-align:left}
details.tbl th{font-weight:600;color:var(--ink-2)}
.range{display:flex;gap:6px;margin-bottom:14px}
.range .chip{flex:1;text-align:center}
.trend-group{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:18px 0 8px;font-family:"IBM Plex Sans",sans-serif}
.trend-group:first-of-type{margin-top:0}

/* ---------- sources ---------- */
.source{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:10px}
.source .head{display:flex;align-items:center;gap:10px}
.source .logo{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:13px;flex:none;color:#fff}
.source .head .txt{flex:1;min-width:0}
.source .head .name{font-weight:600}
.source .head .state{font-size:12px;color:var(--muted)}
.source .head .state.ok{color:var(--good-ink)}
.source .how{font-size:13px;color:var(--ink-2);margin-top:10px}
.source .how ol{margin:6px 0 0;padding-left:20px}
.source .how li{margin:2px 0}
.source .act{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.btn{padding:9px 14px;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:14px;min-height:40px}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.5}
.imports .row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px}
.imports .row:last-child{border-bottom:0}
.imports .row .txt{flex:1;min-width:0}
.imports .row .f{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.imports .row .m{color:var(--muted);font-size:12px}
.progress{height:6px;border-radius:3px;background:var(--accent-soft);overflow:hidden;margin-top:10px}
.progress i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.report{font-size:13px;color:var(--ink-2);margin-top:10px;line-height:1.5}
.report b{color:var(--ink);font-weight:600}
.report .k{display:inline-block;background:var(--surface-2);padding:0 6px;border-radius:5px;margin:1px 2px 1px 0;font-size:12px;color:var(--ink)}
.report .k.x{color:var(--muted);text-decoration:line-through}

/* ---------- guide ---------- */
.guide-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.guide-actions .btn{padding:14px 10px;font-family:"Bricolage Grotesque",sans-serif;font-size:15px;display:flex;flex-direction:column;gap:2px;align-items:flex-start;text-align:left;line-height:1.2}
.guide-actions .btn small{font-family:"IBM Plex Sans",sans-serif;font-weight:400;font-size:12px;opacity:.85}
.guide-out{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin-top:12px;font-size:15px;line-height:1.55;max-width:100%}
.guide-out h3{font-size:15px;margin:14px 0 4px;font-family:"IBM Plex Sans",sans-serif;font-weight:600}
.guide-out h3:first-child{margin-top:0}
.guide-out p{margin:0 0 8px}
.guide-out ul{margin:0 0 8px;padding-left:20px}
.guide-out li{margin:2px 0}
.guide-out .meta{font-size:12px;color:var(--muted);margin-bottom:8px;display:flex;justify-content:space-between;gap:10px}
.guide-out.thinking{color:var(--muted)}
.guide-hist details{margin-bottom:6px}
.guide-hist summary{font-size:14px;font-weight:600;cursor:pointer;padding:8px 0;color:var(--ink-2)}
.guide-hist .guide-out{margin-top:4px}

/* ---------- sheet ---------- */
.scrim{position:fixed;inset:0;background:rgba(10,20,15,.45);z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;margin:0 auto;max-width:560px;background:var(--surface);border-radius:20px 20px 0 0;box-shadow:var(--shadow);transform:translateY(105%);transition:transform .25s cubic-bezier(.2,.8,.2,1);max-height:92vh;max-height:92dvh;display:flex;flex-direction:column}
.sheet.on{transform:none}
.sheet .grab{width:38px;height:4px;border-radius:2px;background:var(--axis);margin:10px auto 0}
.sheet header{display:flex;align-items:center;justify-content:space-between;padding:10px 20px 4px}
.sheet header h2{font-size:20px}
.sheet .body{overflow-y:auto;padding:6px 20px calc(env(safe-area-inset-bottom) + 20px)}
.field{display:flex;flex-direction:column;gap:6px;margin-top:14px}
.field label,.field .label{font-size:13px;font-weight:600;color:var(--ink-2)}
.field input[type=text],.field input[type=number],.field input[type=time],.field input[type=datetime-local],.field input[type=date],.field select,.field textarea{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:16px;min-height:46px}
.field textarea{min-height:72px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.bigin{display:flex;align-items:center;gap:10px}
.bigin input{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:28px !important;letter-spacing:-.02em;text-align:center}
.bigin .u{font-size:14px;color:var(--ink-2);font-weight:600;min-width:44px}

<script>
/* =====================================================================
   Vitalog - a personal health logbook and dashboard.
   Data is stored in this browser's localStorage and, when opened through
   claude.ai, mirrored to the artifact's private storage so phone and
   computer see the same thing. Nothing is sent anywhere else.
   ===================================================================== */
(function(){
'use strict';
const KEY = 'vitalog.v1';
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad2 = n => String(n).padStart(2, '0');
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const round = (v, d) => { const m = Math.pow(10, d || 0); return Math.round(v * m) / m; };
const sleepMs = ms => new Promise(r => setTimeout(r, ms));

/* ---------- dates ---------- */
function dayKey(ts){ const d = new Date(ts); return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate()); }
function today(){ return dayKey(Date.now()); }
function dayStart(key){ const [y,m,d] = key.split('-').map(Number); return new Date(y, m-1, d).getTime(); }
function addDays(key, n){ return dayKey(dayStart(key) + n * 864e5 + 36e5*2); }
function fmtTime(ts){ const d = new Date(ts); return pad2(d.getHours()) + ':' + pad2(d.getMinutes()); }
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
function fmtDay(key){ const d = new Date(dayStart(key)); return d.getDate() + ' ' + MONTHS[d.getMonth()]; }
function fmtDayLong(key){
  const t = today();
  if (key === t) return 'Today';
  if (key === addDays(t, -1)) return 'Yesterday';
  const d = new Date(dayStart(key));
  return DAYS[d.getDay()].slice(0,3) + ' ' + d.getDate() + ' ' + MONTHS[d.getMonth()];
}
function toLocalInput(ts){ const d = new Date(ts); return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate())+'T'+pad2(d.getHours())+':'+pad2(d.getMinutes()); }
function fromLocalInput(s){ const t = new Date(s).getTime(); return isNaN(t) ? Date.now() : t; }
/* parse many date spellings into YYYY-MM-DD; null when unreadable */
function parseDay(s){
  if (s == null) return null;
  s = String(s).trim();
  let m = s.match(/^(\d{4})-(\d{2})-(\d{2})/); if (m) return m[1] + '-' + m[2] + '-' + m[3];
  m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/); if (m) return m[3] + '-' + pad2(m[1]) + '-' + pad2(m[2]); /* US m/d/y */
  m = s.match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})/); if (m) return m[3] + '-' + pad2(m[2]) + '-' + pad2(m[1]);
  const t = Date.parse(s); if (!isNaN(t)) return dayKey(t);
  return null;
}

/* ---------- state ---------- */
const DEFAULTS = {
  v: 1,
  settings: { weightUnit:'kg', glucoseUnit:'mg/dL', tempUnit:'C', waterGoal: 2000, glass: 250, calGoal: 0, about:'', notify:false, demo:false },
  meds: [],       /* {id,name,dose,times:['08:00'],active,notes,demo} */
  doses: {},      /* dayKey -> { medId|time : ts } */
  entries: [],    /* {id,ts,type,...,note,demo} */
  daily: {},      /* dayKey -> { metric: value, _s: { metric: sourceKind } }   (imported, one value per day) */
  sources: [],    /* import log: {id, at, file, kind, days, fields, ignored} */
  guidance: [],   /* {id, ts, kind:'daily'|'weekly', text} */
  savedAt: 0
};
let S = load();
let tab = 'today';
let range = 30;
let histFilter = 'all';

function normalize(p){
  p.settings = Object.assign({}, DEFAULTS.settings, p.settings || {});
  ['meds','entries','sources','guidance'].forEach(k => { if (!Array.isArray(p[k])) p[k] = []; });
  ['doses','daily'].forEach(k => { if (!p[k] || typeof p[k] !== 'object') p[k] = {}; });
  p.savedAt = p.savedAt || 0;
  return p;
}
function load(){
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) { const p = JSON.parse(raw); if (p && p.v === 1) return normalize(p); }
  } catch (e) { /* storage unavailable or corrupt: start fresh in memory */ }
  const fresh = JSON.parse(JSON.stringify(DEFAULTS));
  seedDemo(fresh);
  return fresh;
}
function save(){
  S.savedAt = Date.now();
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { toast('Could not save locally. Storage is full or blocked.'); }
  cloudSave();
}

/* ---------- units ---------- */
const KG_LB = 2.2046226218;
function wOut(kg){ return S.settings.weightUnit === 'lb' ? round(kg * KG_LB, 1) : round(kg, 1); }
function wIn(v){ return S.settings.weightUnit === 'lb' ? v / KG_LB : v; }
function gOut(mgdl){ return S.settings.glucoseUnit === 'mmol/L' ? round(mgdl / 18, 1) : Math.round(mgdl); }
function gIn(v){ return S.settings.glucoseUnit === 'mmol/L' ? v * 18 : v; }
function tOut(c){ return S.settings.tempUnit === 'F' ? round(c * 9/5 + 32, 1) : round(c, 1); }
function tIn(v){ return S.settings.tempUnit === 'F' ? (v - 32) * 5/9 : v; }
const wUnit = () => S.settings.weightUnit;
const gUnit = () => S.settings.glucoseUnit;
const tUnit = () => '°' + S.settings.tempUnit;

/* ---------- entry types (manual log) ---------- */
const MOODS = ['Awful','Low','Okay','Good','Great'];
const SYMPTOMS = ['Headache','Fatigue','Nausea','Dizziness','Anxiety','Cough','Fever','Sore throat','Back pain','Stomach ache','Poor sleep','Brain fog'];
const EXERCISES = ['Walk','Run','Cycle','Strength','Yoga','Swim','Other'];
const TYPES = {
  water:    { code:'H₂O', label:'Water' },
  weight:   { code:'Wt',  label:'Weight' },
  body:     { code:'Bf',  label:'Body composition' },
  bp:       { code:'BP',  label:'Blood pressure' },
  hr:       { code:'HR',  label:'Heart rate' },
  glucose:  { code:'Gl',  label:'Glucose' },
  temp:     { code:'°',   label:'Temperature' },
  sleep:    { code:'Zz',  label:'Sleep' },
  cpap:     { code:'Air', label:'CPAP night' },
  exercise: { code:'Ex',  label:'Exercise' },
  journal:  { code:'Me',  label:'How I feel' },
};
function summary(e){
  switch (e.type) {
    case 'water': return { main: e.ml + '<small> ml</small>' };
    case 'weight': return { main: wOut(e.kg) + '<small> ' + wUnit() + '</small>' };
    case 'body': { const b = []; if (e.kg) b.push(wOut(e.kg) + ' ' + wUnit()); if (e.bodyFat != null) b.push(e.bodyFat + '% fat'); if (e.muscleKg) b.push(wOut(e.muscleKg) + ' ' + wUnit() + ' muscle'); if (e.visceral) b.push('visceral ' + e.visceral); return { main: esc(b.join(' · ')) }; }
    case 'bp': return { main: e.sys + '/' + e.dia + '<small> mmHg' + (e.pulse ? ' · ' + e.pulse + ' bpm' : '') + '</small>', pill: bpCat(e.sys, e.dia) };
    case 'hr': return { main: e.bpm + '<small> bpm' + (e.ctx ? ' · ' + esc(e.ctx) : '') + '</small>' };
    case 'glucose': return { main: gOut(e.mgdl) + '<small> ' + gUnit() + (e.ctx ? ' · ' + esc(e.ctx) : '') + '</small>' };
    case 'temp': return { main: tOut(e.c) + '<small> ' + tUnit() + '</small>' };
    case 'sleep': return { main: e.hours + '<small> h' + (e.quality ? ' · quality ' + e.quality + '/5' : '') + '</small>' };
    case 'cpap': { const b = []; if (e.score != null) b.push('myAir ' + e.score); if (e.hours != null) b.push(e.hours + ' h'); if (e.ahi != null) b.push('AHI ' + e.ahi); if (e.leak != null) b.push('leak ' + e.leak + ' L/min'); return { main: esc(b.join(' · ')) }; }
    case 'exercise': return { main: esc(e.kind) + ' ' + e.minutes + '<small> min' + (e.intensity ? ' · ' + esc(e.intensity) : '') + '</small>' };
    case 'journal': {
      const bits = [];
      if (e.mood) bits.push('Mood ' + MOODS[e.mood-1]);
      if (e.energy) bits.push('energy ' + e.energy + '/5');
      if (e.pain != null && e.pain > 0) bits.push('pain ' + e.pain + '/10');
      const sym = (e.symptoms || []).map(esc).join(', ');
      return { main: esc(bits.join(' · ') || 'Check-in'), sub: sym };
    }
  }
  return { main: e.type };
}
function bpCat(sys, dia){
  if (sys > 180 || dia > 120) return { cls:'crit', txt:'Crisis - seek care' };
  if (sys >= 140 || dia >= 90) return { cls:'serious', txt:'High, stage 2' };
  if (sys >= 130 || dia >= 80) return { cls:'warn', txt:'High, stage 1' };
  if (sys >= 120) return { cls:'warn', txt:'Elevated' };
  return { cls:'good', txt:'Normal' };
}

/* ---------- unified daily metrics (imports + manual, one value per day) ---------- */
const SOURCES = {
  oura:  { name:'Oura',          color:'#3b3b5c' },
  mfp:   { name:'MyFitnessPal',  color:'#1f6fd6' },
  apple: { name:'Apple Health',  color:'#d6336c' },
  hume:  { name:'Hume',          color:'#0f6e5c' },
  myair: { name:'myAir',         color:'#0a5a8c' },
  manual:{ name:'Logged',        color:'#6b7f76' },
  demo:  { name:'Example',       color:'#8a968f' },
  sync:  { name:'Synced',        color:'#0f6e5c' },
};
const METRICS = {
  sleepScore:   { label:'Sleep score',      unit:'',      dec:0, kind:'line', min:0, max:100 },
  readiness:    { label:'Readiness',        unit:'',      dec:0, kind:'line', min:0, max:100 },
  activityScore:{ label:'Activity score',   unit:'',      dec:0, kind:'line', min:0, max:100 },
  hrv:          { label:'HRV',              unit:'ms',    dec:0, kind:'line' },
  rhr:          { label:'Resting heart rate',unit:'bpm',  dec:0, kind:'line' },
  sleepHours:   { label:'Sleep',            unit:'h',     dec:1, kind:'bar' },
  spo2:         { label:'Blood oxygen',     unit:'%',     dec:1, kind:'line' },
  respRate:     { label:'Breathing rate',   unit:'/min',  dec:1, kind:'line' },
  tempDev:      { label:'Temperature deviation', unit:'°C', dec:2, kind:'line' },
  steps:        { label:'Steps',            unit:'',      dec:0, kind:'bar' },
  activeCal:    { label:'Active calories',  unit:'kcal',  dec:0, kind:'bar' },
  calories:     { label:'Calories eaten',   unit:'kcal',  dec:0, kind:'bar' },
  protein:      { label:'Protein',          unit:'g',     dec:0, kind:'bar' },
  carbs:        { label:'Carbs',            unit:'g',     dec:0, kind:'bar' },
  fat:          { label:'Fat',              unit:'g',     dec:0, kind:'bar' },
  fiber:        { label:'Fiber',            unit:'g',     dec:0, kind:'bar' },
  sugar:        { label:'Sugar',            unit:'g',     dec:0, kind:'bar' },
  sodium:       { label:'Sodium',           unit:'mg',    dec:0, kind:'bar' },
  exerciseMin:  { label:'Exercise',         unit:'min',   dec:0, kind:'bar' },
  exerciseCal:  { label:'Exercise calories',unit:'kcal',  dec:0, kind:'bar' },
  weightKg:     { label:'Weight',           unit:'kg',    dec:1, kind:'line' },
  bodyFat:      { label:'Body fat',         unit:'%',     dec:1, kind:'line' },
  muscleKg:     { label:'Muscle mass',      unit:'kg',    dec:1, kind:'line' },
  visceral:     { label:'Visceral fat',     unit:'',      dec:1, kind:'line' },
  myairScore:   { label:'myAir score',      unit:'/100',  dec:0, kind:'line', min:0, max:100 },
  cpapHours:    { label:'CPAP usage',       unit:'h',     dec:1, kind:'bar' },
  ahi:          { label:'AHI',              unit:'/h',    dec:1, kind:'bar' },
  leak:         { label:'Mask leak',        unit:'L/min', dec:0, kind:'line' },
  maskEvents:   { label:'Mask on/off',      unit:'',      dec:0, kind:'bar' },
  water:        { label:'Water',            unit:'ml',    dec:0, kind:'bar' },
};
function setDaily(day, field, value, src, mode){
  if (value == null || isNaN(value) || !isFinite(value)) return;
  const d = S.daily[day] || (S.daily[day] = {});
  if (mode === 'sum' && d._acc && d._acc[field]) d[field] = round(d[field] + value, 3); else d[field] = round(value, 3);
  if (mode === 'sum') (d._acc || (d._acc = {}))[field] = 1;
  (d._s || (d._s = {}))[field] = src;
}
function endImportAccumulators(){ Object.values(S.daily).forEach(d => { delete d._acc; }); }

/* per-day view merging imported values with manual entries (manual wins) */
const manualDailyCache = { key: null, map: null };
function manualDaily(){
  const k = S.entries.length + ':' + S.savedAt;
  if (manualDailyCache.key === k) return manualDailyCache.map;
  const m = new Map();
  const put = (day, f, v, mode) => {
    if (v == null || isNaN(v)) return;
    const o = m.get(day) || (m.set(day, {}), m.get(day));
    if (mode === 'sum') o[f] = (o[f] || 0) + v; else if (mode === 'avg') { o['_n' + f] = (o['_n' + f] || 0) + 1; o[f] = ((o[f] || 0) * (o['_n' + f] - 1) + v) / o['_n' + f]; } else o[f] = v;
  };
  S.entries.slice().sort((a,b) => a.ts - b.ts).forEach(e => {
    const d = dayKey(e.ts);
    switch (e.type) {
      case 'water': put(d, 'water', e.ml, 'sum'); break;
      case 'weight': put(d, 'weightKg', e.kg); break;
      case 'body': if (e.kg) put(d, 'weightKg', e.kg); if (e.bodyFat != null) put(d, 'bodyFat', e.bodyFat); if (e.muscleKg) put(d, 'muscleKg', e.muscleKg); if (e.visceral) put(d, 'visceral', e.visceral); break;
      case 'sleep': put(d, 'sleepHours', e.hours); break;
      case 'cpap': if (e.score != null) put(d, 'myairScore', e.score); if (e.hours != null) put(d, 'cpapHours', e.hours); if (e.ahi != null) put(d, 'ahi', e.ahi); if (e.leak != null) put(d, 'leak', e.leak); if (e.maskEvents != null) put(d, 'maskEvents', e.maskEvents); break;
      case 'exercise': put(d, 'exerciseMin', e.minutes, 'sum'); break;
      case 'hr': if (e.ctx === 'Resting') put(d, 'rhr', e.bpm, 'avg'); break;
    }
  });
  manualDailyCache.key = k; manualDailyCache.map = m;
  return m;
}
/* value + source for one metric on one day */
function metric(day, f){
  const m = manualDaily().get(day);
  if (m && m[f] != null) return { v: m[f], src: 'manual' };
  const fd = cloud.feed && cloud.feed.daily && cloud.feed.daily[day];
  if (fd && fd[f] != null) return { v: fd[f], src: (fd._s && fd._s[f]) || 'sync' };
  const d = S.daily[day];
  if (d && d[f] != null) return { v: d[f], src: (d._s && d._s[f]) || 'import' };
  return null;
}
function latestMetric(f, maxAgeDays){
  const t = today();
  for (let i = 0; i < (maxAgeDays || 14); i++) { const k = addDays(t, -i); const r = metric(k, f); if (r) return Object.assign({ day: k }, r); }
  return null;
}
function seriesOf(f, days, conv){
  const out = new Map();
  const from = addDays(today(), -(days-1));
  for (let k = from; k <= today(); k = addDays(k, 1)) { const r = metric(k, f); if (r) out.set(k, conv ? conv(r.v) : r.v); }
  return out;
}
function hasMetric(f, days){ return seriesOf(f, days).size > 0; }
function avg(map){ if (!map.size) return null; let s = 0; map.forEach(v => s += v); return s / map.size; }

/* ---------- queries (manual entries) ---------- */
const sorted = () => S.entries.slice().sort((a,b) => a.ts - b.ts);
function ofType(t){ return sorted().filter(e => e.type === t); }
function latest(t){ const a = ofType(t); return a.length ? a[a.length-1] : null; }
function onDay(key){ return sorted().filter(e => dayKey(e.ts) === key); }
function waterToday(){ return onDay(today()).filter(e => e.type === 'water').reduce((s,e) => s + e.ml, 0); }
function streak(){
  let n = 0, k = today();
  const days = new Set(S.entries.map(e => dayKey(e.ts)));
  Object.keys(S.doses).forEach(d => { if (Object.keys(S.doses[d]).length) days.add(d); });
  if (!days.has(k)) k = addDays(k, -1);
  while (days.has(k)) { n++; k = addDays(k, -1); }
  return n;
}
function daily(type, field, mode, days){
  const out = new Map();
  const from = addDays(today(), -(days-1));
  ofType(type).forEach(e => {
    const k = dayKey(e.ts);
    if (k < from) return;
    const v = typeof field === 'function' ? field(e) : e[field];
    if (v == null || isNaN(v)) return;
    if (!out.has(k)) out.set(k, { sum:0, n:0, last:v });
    const o = out.get(k); o.sum += v; o.n++; o.last = v;
  });
  const res = new Map();
  out.forEach((o,k) => res.set(k, mode === 'sum' ? o.sum : mode === 'avg' ? o.sum / o.n : o.last));
  return res;
}

/* chart: one scale, hairline grid, thin marks, crosshair tooltip, table view */
const chartMeta = {};
function chartCard(c){
  const W = 360, H = 170, L = 38, R = 14, T = 12, B = 22;
  const days = [];
  for (let i = range-1; i >= 0; i--) days.push(addDays(today(), -i));
  const n = days.length;
  const x = i => L + (n === 1 ? (W-L-R)/2 : i * (W-L-R) / (n-1));
  const slot = (W-L-R) / Math.max(n,1);
  let vals = [];
  c.series.forEach(s => s.data.forEach(v => vals.push(v)));
  if (!vals.length) return '';
  if (c.bands) c.bands.forEach(b => vals.push(b[0], b[1]));
  if (c.goal) vals.push(c.goal);
  let lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals);
  if (c.kind === 'bar') lo = Math.min(0, lo);
  if (c.yMin != null) lo = Math.min(lo, c.yMin);
  if (c.yMax != null) hi = Math.max(hi, c.yMax);
  const ticks = niceTicks(lo, hi, 4);
  lo = ticks[0]; hi = ticks[ticks.length-1];
  const y = v => T + (H-T-B) * (1 - (v - lo) / (hi - lo || 1));
  const fmt = v => c.fmt ? c.fmt(v) : round(v, c.dec).toLocaleString();

  let svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(c.title) + ' over the last ' + n + ' days">';
  if (c.bands) c.bands.forEach(b => { svg += '<rect class="band" x="' + L + '" y="' + y(b[1]) + '" width="' + (W-L-R) + '" height="' + (y(b[0]) - y(b[1])) + '"/>'; });
  ticks.forEach(t => { svg += '<line class="grid" x1="' + L + '" x2="' + (W-R) + '" y1="' + y(t) + '" y2="' + y(t) + '"/><text x="' + (L-6) + '" y="' + (y(t)+3.5) + '" text-anchor="end">' + esc(fmt(t)) + '</text>'; });

function niceTicks(lo, hi, n){
  if (!isFinite(lo) || !isFinite(hi)) { lo = 0; hi = 1; }
  if (hi - lo < 1e-9) { lo -= 1; hi += 1; }
  const raw = (hi - lo) / n;
  const p = Math.pow(10, Math.floor(Math.log10(raw)));
  const f = raw / p;
  const step = (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p;
  const a = Math.floor(lo / step) * step, b = Math.ceil(hi / step) * step;
  const out = [];
  for (let v = a; v <= b + step/2; v += step) out.push(round(v, 6));
  return out;
}
function bindCharts(root){
  $$('.chart-card', root).forEach(card => {
    const m = chartMeta[card.dataset.chart]; if (!m) return;
    const svg = $('svg', card), tip = $('.tip', card), xh = $('.xh', card);
    const move = ev => {
      const r = svg.getBoundingClientRect();
      const px = (ev.clientX - r.left) / r.width * m.W;
      const n = m.days.length;
      let i = n === 1 ? 0 : Math.round((px - m.L) / ((m.W - m.L - m.R) / (n - 1)));
      i = clamp(i, 0, n-1);
      const d = m.days[i];
      const rows = m.series.filter(s => s.data.has(d));
      if (!rows.length) { tip.classList.remove('on'); xh.classList.remove('on'); return; }
      xh.setAttribute('x1', m.x(i)); xh.setAttribute('x2', m.x(i)); xh.classList.add('on');
      tip.textContent = '';
      const dd = document.createElement('div'); dd.className = 'd'; dd.textContent = fmtDayLong(d); tip.appendChild(dd);
      rows.forEach(s => {
        const row = document.createElement('div'); row.className = 'r';
        const key = document.createElement('i'); key.style.background = s.color;
        const b = document.createElement('b'); b.textContent = m.fmt(s.data.get(d)) + (m.unit ? ' ' + m.unit : '');
        const sp = document.createElement('span'); sp.textContent = m.series.length > 1 ? s.name : '';
        row.appendChild(key); row.appendChild(b); if (sp.textContent) row.appendChild(sp); tip.appendChild(row);
      });
      tip.classList.add('on');
      const cx = m.x(i) / m.W * r.width;
      const tw = tip.offsetWidth;
      tip.style.left = clamp(cx - tw/2, 0, r.width - tw) + 'px';
    };
    svg.addEventListener('pointermove', move);
    svg.addEventListener('pointerdown', move);
    svg.addEventListener('pointerleave', () => { tip.classList.remove('on'); xh.classList.remove('on'); });
  });
}

/* a small, safe markdown subset: headings, bold, bullets, paragraphs */
function mdToHtml(md){
  const lines = String(md || '').split(/\r?\n/);
  let out = '', inList = false, para = [];
  const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/(^|\s)\*(?!\s)(.+?)\*(?=\s|$|[.,;:])/g, '$1<i>$2</i>');
  const flush = () => { if (para.length) { out += '<p>' + inline(para.join(' ')) + '</p>'; para = []; } };
  const endList = () => { if (inList) { out += '</ul>'; inList = false; } };
  lines.forEach(l => {
    const t = l.trim();
    if (!t) { flush(); endList(); return; }
    let m = t.match(/^#{1,6}\s+(.*)$/); if (m) { flush(); endList(); out += '<h3>' + inline(m[1]) + '</h3>'; return; }
    m = t.match(/^[-*•]\s+(.*)$/); if (m) { flush(); if (!inList) { out += '<ul>'; inList = true; } out += '<li>' + inline(m[1]) + '</li>'; return; }
    m = t.match(/^\d+[.)]\s+(.*)$/); if (m) { flush(); if (!inList) { out += '<ul>'; inList = true; } out += '<li>' + inline(m[1]) + '</li>'; return; }
    endList(); para.push(t);
  });
  flush(); endList();
  return out;
}

    S.guidance.push({ id: uid(), ts: Date.now(), kind, text });
    save();
  } catch (e) {
    const code = e && e.code;
    if (code === 'not_granted') { cloud.sample = null; toast('Guidance was not allowed on this page.'); }
    else if (code === 'rate_limited') toast('Claude is busy right now. Try again in a minute.');
    else if (code === 'cancelled') toast('Stopped.');
    else toast('Could not get guidance: ' + (e && e.message ? e.message : 'unknown error'));
    if (e && e.text) { S.guidance.push({ id: uid(), ts: Date.now(), kind, text: e.text + '\n\n*(cut short)*' }); save(); }
  }
  guideBusy = false; render();
  window.scrollTo(0, 0);
}

function openSheet(title, body, onOpen){
  $('#sheetTitle').textContent = title;
  $('#sheetBody').innerHTML = body;
  $('#scrim').classList.add('on'); $('#sheet').classList.add('on');
  if (onOpen) onOpen($('#sheetBody'));
  const first = $('input:not([type=hidden]),select,textarea,button', $('#sheetBody'));
  if (first && first.tagName !== 'BUTTON' && window.innerWidth > 600) first.focus();
}
function closeSheet(){ $('#scrim').classList.remove('on'); $('#sheet').classList.remove('on'); }
$('#scrim').addEventListener('click', closeSheet);
$('#sheetClose').addEventListener('click', closeSheet);

function whenField(ts){ return '<div class="field"><label for="f_when">When</label><input type="datetime-local" id="f_when" value="' + toLocalInput(ts || Date.now()) + '"></div>'; }
function noteField(){ return '<div class="field"><label for="f_note">Note <span style="font-weight:400">(optional)</span></label><input type="text" id="f_note" placeholder="Anything worth remembering"></div>'; }
function segField(id, label, opts, val){
  return '<div class="field"><span class="label">' + esc(label) + '</span><div class="seg grow" id="' + id + '" role="group" aria-label="' + esc(label) + '">' +
    opts.map(o => '<button type="button" data-v="' + esc(o) + '" aria-pressed="' + (o === val) + '">' + esc(o) + '</button>').join('') + '</div></div>';
}
function scaleField(id, label, lo, hi, val, ends){
  let b = '';
  for (let i = lo; i <= hi; i++) b += '<button type="button" data-v="' + i + '" aria-pressed="' + (i === val) + '">' + i + '</button>';
  return '<div class="field"><span class="label">' + esc(label) + '</span><div class="scale" id="' + id + '" role="group" aria-label="' + esc(label) + '">' + b + '</div>' +
    (ends ? '<div class="scale-lbls"><span>' + esc(ends[0]) + '</span><span>' + esc(ends[1]) + '</span></div>' : '') + '</div>';
}
function numField(id, label, unit, attrs, val){ return '<div class="field"><label for="' + id + '">' + esc(label) + '</label><div class="bigin"><input type="number" id="' + id + '" ' + attrs + ' value="' + (val == null ? '' : val) + '"><span class="u">' + esc(unit) + '</span></div></div>'; }
function bindSeg(root){
  $$('.seg,.scale', root).forEach(g => g.addEventListener('click', ev => {
    const b = ev.target.closest('button'); if (!b) return;
    const multi = g.dataset.multi === '1';
    if (multi) b.setAttribute('aria-pressed', String(b.getAttribute('aria-pressed') !== 'true'));
    else $$('button', g).forEach(x => x.setAttribute('aria-pressed', String(x === b)));
  }));
}
const segVal = id => { const b = $('#' + id + ' [aria-pressed="true"]'); return b ? b.dataset.v : null; };
const segVals = id => $$('#' + id + ' [aria-pressed="true"]').map(b => b.dataset.v);
const num = id => { const el = $('#' + id); if (!el) return null; const v = parseFloat(el.value); return isNaN(v) ? null : v; };

    case 'weight': { const last = latestMetric('weightKg', 60); f = numField('f_kg', 'Weight', wUnit(), 'inputmode="decimal" step="0.1" min="1" placeholder="0.0"', last ? wOut(last.v) : ''); break; }

    case 'hr': f = numField('f_bpm', 'Heart rate', 'bpm', 'inputmode="numeric" placeholder="65" min="20" max="250"') + segField('f_ctx', 'Context', ['Resting','After activity','Other'], 'Resting'); break;
    case 'glucose': f = numField('f_gl', 'Blood glucose', gUnit(), 'inputmode="decimal" step="' + (gUnit() === 'mmol/L' ? '0.1' : '1') + '" placeholder="' + (gUnit() === 'mmol/L' ? '5.5' : '95') + '"') + segField('f_ctx', 'When', ['Fasting','Before meal','After meal','Bedtime'], 'Fasting'); break;

    case 'sleep': f = numField('f_h', 'Hours slept', 'h', 'inputmode="decimal" step="0.25" min="0" max="24" placeholder="7.5"') + scaleField('f_q', 'Sleep quality', 1, 5, 3, ['Terrible','Refreshed']); break;

  openSheet(T.label, f, root => {

        case 'body': { const v = num('f_kg'), bf = num('f_bf'), mu = num('f_mu'), vf = num('f_vf'); if (!v && bf == null && !mu) return bad('Enter at least one number.'); if (v) e.kg = round(wIn(v), 2); if (bf != null) e.bodyFat = round(bf, 1); if (mu) e.muscleKg = round(wIn(mu), 2); if (vf) e.visceral = vf; break; }

        case 'glucose': { const v = num('f_gl'); if (!v) return bad('Enter a glucose reading.'); e.mgdl = round(gIn(v), 1); e.ctx = segVal('f_ctx'); break; }
        case 'temp': { const v = num('f_c'); if (!v) return bad('Enter a temperature.'); e.c = round(tIn(v), 2); break; }
        case 'sleep': e.hours = num('f_h'); if (e.hours == null || e.hours < 0) return bad('Enter hours slept.'); e.quality = +segVal('f_q'); break;
        case 'cpap': { e.score = num('f_score'); e.hours = num('f_hours'); e.ahi = num('f_ahi'); e.leak = num('f_leak'); e.maskEvents = num('f_mask'); if (e.score == null && e.hours == null && e.ahi == null) return bad('Enter at least the score, hours or AHI.'); break; }
        case 'exercise': e.kind = segVal('f_kind'); e.minutes = num('f_min'); if (!e.minutes) return bad('Enter how many minutes.'); e.intensity = segVal('f_int'); break;
        case 'journal': e.mood = +segVal('f_mood'); e.energy = +segVal('f_energy'); e.pain = +segVal('f_pain'); e.symptoms = segVals('f_sym'); break;
      }
      S.entries.push(e); save(); closeSheet(); render();
      toast(T.label + ' saved');
    });
  });
}

  const cfg = cloud.config || {};
  let f = '<p class="hint">One-time setup, on any browser:</p><ol class="hint" style="padding-left:20px;margin:8px 0">' +
    '<li>Sign in at <b>cloud.ouraring.com/oauth/applications</b> and create an application. Any name. Redirect URI: the address of your Vitalog <b>oauth.html</b> page (see the automation guide). Copy the <b>Client ID</b>.</li>' +

    '<li>Paste that token here and save. Repeat in 30 days when it expires.</li></ol>' +
    '<div class="field"><label for="o_client">Oura Client ID</label><input type="text" id="o_client" autocomplete="off" value="' + esc(cfg.ouraClientId || '') + '" placeholder="From cloud.ouraring.com/oauth/applications"></div>' +
    '<div class="field"><label for="o_redirect">Redirect address (your oauth.html)</label><input type="text" id="o_redirect" autocomplete="off" value="' + esc(cfg.ouraRedirect || '') + '" placeholder="https://YOURNAME.github.io/REPO/oauth.html"></div>' +

  openSheet('Connect Oura', f, root => {
    const saveCfg = async patch => { try { await cloud.db.doc('vitalog/config').set(Object.assign({}, cloud.config || {}, patch)); cloud.config = Object.assign({}, cloud.config || {}, patch); return true; } catch (e) { toast('Could not save. Open Vitalog through your Claude link.'); return false; } };

  });
}

function parseCSV(text){
  const rows = []; let row = [], cell = '', q = false;
  text = text.replace(/^﻿/, '');
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i+1] === '"') { cell += '"'; i++; } else q = false; } else cell += c; }
    else if (c === '"') q = true;
    else if (c === ',' || c === ';' || c === '\t') { row.push(cell); cell = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i+1] === '\n') i++; row.push(cell); cell = ''; if (row.some(x => x !== '')) rows.push(row); row = []; }
    else cell += c;
  }
  if (cell !== '' || row.length) { row.push(cell); if (row.some(x => x !== '')) rows.push(row); }

  const headers = rows[0].map(h => h.trim());
  return { headers, rows: rows.slice(1).map(r => { const o = {}; headers.forEach((h,i) => o[h] = (r[i] || '').trim()); return o; }) };
}
const norm = h => String(h).toLowerCase().replace(/[_\-]/g, ' ').replace(/\s+/g, ' ').replace(/[()%:]/g, '').trim();

const ALIASES = [

  [/^(readiness score|readiness|readinessscore)$/, 'readiness'],
  [/^(activity score|activityscore)$/, 'activityScore'],
  [/^(average hrv|averagehrv|hrv|avg hrv|hrv balance|heart rate variability|average heart rate variability)$/, 'hrv'],
  [/^(resting heart rate|lowest resting heart rate|lowest heart rate|average resting heart rate|rhr|restingheartrate|lowestheartrate)$/, 'rhr'],
  [/^(total sleep|total sleep duration|total sleep time|sleep duration|time asleep|totalsleep|total sleep hours|asleep)$/, 'sleepHours', 'duration'],
  [/^(steps|total steps|step count|daily steps)$/, 'steps'],
  [/^(active calories|activecalories|active calorie burn|cal active)$/, 'activeCal'],
  [/^(blood oxygen|spo2|average spo2|average blood oxygen|spo2 percentage|blood oxygen average)$/, 'spo2'],
  [/^(respiratory rate|average respiratory rate|average breath|breathing rate|average breathing rate)$/, 'respRate'],
  [/^(temperature deviation|body temperature deviation|temperature trend deviation|skin temperature deviation|temp deviation)$/, 'tempDev'],
  [/^(calories|energy|calories kcal|energy kcal|total calories eaten|calories consumed)$/, 'calories', 'sum'],
  [/^(protein|protein g|proteins)$/, 'protein', 'sum'],
  [/^(carbohydrates|carbohydrates g|carbs|carbs g|net carbs|total carbohydrate)$/, 'carbs', 'sum'],
  [/^(fat|fat g|total fat|fats)$/, 'fat', 'sum'],
  [/^(fiber|fiber g|fibre|dietary fiber)$/, 'fiber', 'sum'],
  [/^(sugar|sugar g|sugars)$/, 'sugar', 'sum'],
  [/^(sodium|sodium mg)$/, 'sodium', 'sum'],
  [/^(exercise calories|calories burned|exercise calories kcal)$/, 'exerciseCal', 'sum'],
  [/^(exercise minutes|minutes|duration minutes|exercise duration)$/, 'exerciseMin', 'sum'],
  [/^(weight|body weight|weight kg|weight lb|weight lbs|bodyweight)$/, 'weightKg', 'weight'],
  [/^(body fat|body fat percentage|bodyfat|fat percentage|body fat percent)$/, 'bodyFat'],
  [/^(muscle mass|skeletal muscle mass|muscle|muscle mass kg|lean body mass|lean mass)$/, 'muscleKg', 'weight'],
  [/^(visceral fat|visceral fat level|visceral)$/, 'visceral'],
  [/^(myair score|score|total score|myairscore)$/, 'myairScore'],
  [/^(usage hours|usage|hours used|usage minutes|cpap usage)$/, 'cpapHours', 'duration'],
  [/^(ahi|events per hour|events hour|ahi events per hour)$/, 'ahi'],
  [/^(mask leak|leak|leak l min|mask seal)$/, 'leak'],
  [/^(mask on off|mask on off count|mask events|mask on offs)$/, 'maskEvents'],
  [/^(water|water ml|hydration)$/, 'water', 'sum'],

function matchField(h){ const n = norm(h); for (const a of ALIASES) if (a[0].test(n)) return { f: a[1], mode: a[2] || 'last' }; return null; }
function convert(mode, v, header){

    const n = norm(header);
    if (/second|sec/.test(n) || v > 1500) return v / 3600;
    if (/minute|min/.test(n) || v > 30) return v / 60;
    return v;
  }
  if (mode === 'weight') { const n = norm(header); if (/lb/.test(n) || (!/kg/.test(n) && v > 130)) return v / KG_LB; return v; }
  return v;
}
function dateColumn(headers){
  const pref = ['day','date','summary date','calendar date','date time','datetime','timestamp','start','night'];
  for (const p of pref) { const h = headers.find(x => norm(x) === p); if (h) return h; }
  return headers.find(x => /date|day|time/.test(norm(x))) || null;
}
function guessKind(name, headers){
  const hs = headers.map(norm), fn = name.toLowerCase();
  if (/nutrition|exercise|measurement|myfitnesspal|mfp/.test(fn) || hs.includes('meal') || hs.some(h => /exercise calories|exercise minutes/.test(h))) return 'mfp';
  if (/oura/.test(fn) || hs.some(h => /readiness|sleep score|hrv|temperature deviation|respiratory/.test(h))) return 'oura';
  if (/hume|body pod|bodypod/.test(fn) || hs.some(h => /body fat|muscle|visceral/.test(h))) return 'hume';
  if (/myair|resmed|cpap/.test(fn) || hs.some(h => /ahi|mask|usage/.test(h))) return 'myair';

function importCSV(name, text, log){
  const { headers, rows } = parseCSV(text);
  if (!headers.length || !rows.length) { log.skip(name, 'empty file'); return; }
  const dcol = dateColumn(headers);
  if (!dcol) { log.skip(name, 'no date column (' + headers.slice(0,6).join(', ') + ')'); return; }
  const kind = guessKind(name, headers);
  const cols = headers.filter(h => h !== dcol).map(h => ({ h, m: matchField(h) }));
  const used = cols.filter(c => c.m), ignored = cols.filter(c => !c.m).map(c => c.h);
  if (!used.length) { log.skip(name, 'no recognised columns (' + ignored.slice(0,8).join(', ') + ')'); return; }
  const days = new Set(); let n = 0;
  rows.forEach(r => {
    const day = parseDay(r[dcol]); if (!day) return;
    used.forEach(c => {
      const raw = String(r[c.h]).replace(/,/g, '').replace(/[^0-9.\-]/g, '');
      if (raw === '' || raw === '-') return;
      const v = parseFloat(raw); if (isNaN(v)) return;
      const mode = c.m.mode === 'sum' ? 'sum' : 'last';
      setDaily(day, c.m.f, convert(c.m.mode, v, c.h), kind, mode); days.add(day); n++;

  });

/* Oura Membership Hub / API-shaped JSON: arrays of {day, score, ...} */
function importOuraJSON(name, data, log){
  const days = new Set(), fields = new Set(); let n = 0;
  const put = (day, f, v, mode) => { if (v == null || isNaN(v)) return; setDaily(day, f, v, 'oura', mode); days.add(day); fields.add(f); n++; };
  const walk = (node, hint) => {
    if (Array.isArray(node)) { node.forEach(x => walk(x, hint)); return; }
    if (!node || typeof node !== 'object') return;
    const day = parseDay(node.day || node.summary_date || node.date);
    if (day) {
      const c = node.contributors || {};
      const h = (hint || '').toLowerCase();
      if (node.score != null) {
        if (/readiness/.test(h) || 'hrv_balance' in c || 'recovery_index' in c) put(day, 'readiness', +node.score);
        else if (/activity/.test(h) || 'meet_daily_targets' in c || 'stay_active' in c) put(day, 'activityScore', +node.score);
        else if (/sleep/.test(h) || 'deep_sleep' in c || 'rem_sleep' in c || 'total_sleep' in c) put(day, 'sleepScore', +node.score);
      }
      if (node.average_hrv != null) put(day, 'hrv', +node.average_hrv);
      if (node.lowest_heart_rate != null) put(day, 'rhr', +node.lowest_heart_rate);
      if (node.total_sleep_duration != null && (!node.type || node.type === 'long_sleep')) put(day, 'sleepHours', +node.total_sleep_duration / 3600);
      if (node.average_breath != null) put(day, 'respRate', +node.average_breath);
      if (node.steps != null) put(day, 'steps', +node.steps);
      if (node.active_calories != null) put(day, 'activeCal', +node.active_calories);
      if (node.temperature_deviation != null) put(day, 'tempDev', +node.temperature_deviation);
      if (node.spo2_percentage && node.spo2_percentage.average != null) put(day, 'spo2', +node.spo2_percentage.average);
      if (node.rmssd != null) put(day, 'hrv', +node.rmssd);
      if (node.hr_lowest != null) put(day, 'rhr', +node.hr_lowest);
      if (node.total != null && /sleep/.test(h) && +node.total > 3600) put(day, 'sleepHours', +node.total / 3600);
      if (node.breath_average != null) put(day, 'respRate', +node.breath_average);
      if (node.temperature_delta != null) put(day, 'tempDev', +node.temperature_delta);
      if (node.cal_active != null) put(day, 'activeCal', +node.cal_active);
    }
    Object.keys(node).forEach(k => { const v = node[k]; if (v && typeof v === 'object' && k !== 'contributors') walk(v, k); });
  };

  if (!n) { log.skip(name, 'no Oura-shaped daily data found'); return; }
  log.done(name, 'oura', days, Array.from(fields), [], n);
}
/* Apple Health export.xml: scan <Record> elements in chunks so the page stays responsive */
async function importAppleXML(name, text, log, progress){
  const types = {
    'HKQuantityTypeIdentifierStepCount': ['steps','sum'],
    'HKQuantityTypeIdentifierBodyMass': ['weightKg','last'],
    'HKQuantityTypeIdentifierBodyFatPercentage': ['bodyFat','last'],
    'HKQuantityTypeIdentifierLeanBodyMass': ['muscleKg','last'],
    'HKQuantityTypeIdentifierHeartRateVariabilitySDNN': ['hrv','avg'],
    'HKQuantityTypeIdentifierRestingHeartRate': ['rhr','last'],
    'HKQuantityTypeIdentifierOxygenSaturation': ['spo2','avg'],
    'HKQuantityTypeIdentifierRespiratoryRate': ['respRate','avg'],
    'HKQuantityTypeIdentifierActiveEnergyBurned': ['activeCal','sum'],
    'HKQuantityTypeIdentifierDietaryEnergyConsumed': ['calories','sum'],
    'HKQuantityTypeIdentifierDietaryProtein': ['protein','sum'],
    'HKQuantityTypeIdentifierDietaryCarbohydrates': ['carbs','sum'],
    'HKQuantityTypeIdentifierDietaryFatTotal': ['fat','sum'],
    'HKQuantityTypeIdentifierDietaryFiber': ['fiber','sum'],
    'HKQuantityTypeIdentifierDietarySugar': ['sugar','sum'],
    'HKQuantityTypeIdentifierDietarySodium': ['sodium','sum'],
    'HKQuantityTypeIdentifierDietaryWater': ['water','sum'],
    'HKCategoryTypeIdentifierSleepAnalysis': ['sleepHours','sum'],
  };
  const modeOf = {}; Object.keys(types).forEach(k => { modeOf[types[k][0]] = types[k][1]; });
  const acc = {}; /* day -> field -> {sum,n,last,src} */
  const srcOf = s => { s = (s || '').toLowerCase(); if (/oura/.test(s)) return 'oura'; if (/hume/.test(s)) return 'hume'; if (/myfitnesspal|mfp/.test(s)) return 'mfp'; return 'apple'; };
  const add = (day, f, v, src) => {
    const d = acc[day] || (acc[day] = {}); const o = d[f] || (d[f] = { sum:0, n:0, last:null, src });
    o.sum += v; o.n++; o.last = v; if (src !== 'apple') o.src = src;
  };
  const re = /<Record\s[^>]*?\/?>/g;
  const attr = (s, k) => { const m = s.match(new RegExp('\\s' + k + '="([^"]*)"')); return m ? m[1] : null; };
  const CH = 4e6; let pos = 0, n = 0;
  while (pos < text.length) {
    let end = Math.min(text.length, pos + CH);
    if (end < text.length) { const nx = text.indexOf('<Record', end); end = nx < 0 ? text.length : nx; }
    const chunk = text.slice(pos, end); pos = end;
    let m;
    re.lastIndex = 0;
    while ((m = re.exec(chunk))) {
      const s = m[0];
      const t = attr(s, 'type'); const spec = t && types[t]; if (!spec) continue;
      const f = spec[0];
      const src = srcOf(attr(s, 'sourceName'));
      const start = attr(s, 'startDate'), endD = attr(s, 'endDate');
      if (f === 'sleepHours') {
        const val = attr(s, 'value') || '';
        if (!/Asleep/.test(val)) continue;
        const a = Date.parse(start), b = Date.parse(endD); if (isNaN(a) || isNaN(b) || b <= a) continue;
        add(dayKey(b), f, (b - a) / 36e5, src); n++;
        continue;
      }
      let v = parseFloat(attr(s, 'value')); if (isNaN(v)) continue;
      const unit = (attr(s, 'unit') || '').toLowerCase();
      if (f === 'weightKg' || f === 'muscleKg') { if (unit === 'lb') v /= KG_LB; }
      if (f === 'bodyFat' || f === 'spo2') { if (v <= 1) v *= 100; }
      if (f === 'water') { if (unit === 'l') v *= 1000; else if (unit.startsWith('fl')) v *= 29.57; }
      if (f === 'calories' || f === 'activeCal') { if (unit === 'kj') v /= 4.184; }
      if (f === 'sodium' && unit === 'g') v *= 1000;
      const day = parseDay(start); if (!day) continue;
      add(day, f, v, src); n++;
    }
    if (progress) progress(pos / text.length);
    await sleepMs(0);
  }
  const days = new Set(), fields = new Set();
  Object.keys(acc).forEach(day => { Object.keys(acc[day]).forEach(f => {
    const o = acc[day][f]; const mode = modeOf[f];
    const v = mode === 'sum' ? o.sum : mode === 'avg' ? o.sum / o.n : o.last;
    setDaily(day, f, v, o.src, 'last'); days.add(day); fields.add(f);
  }); });
  if (!n) { log.skip(name, 'no Health records of the kinds Vitalog reads'); return; }
  log.done(name, 'apple', days, Array.from(fields), [], n);
}
async function importFiles(files){
  const out = $('#importOut'); if (!out) return;
  out.innerHTML = '<div class="card pad"><b>Importing…</b><div class="progress"><i id="impBar"></i></div><div class="report" id="impRep"></div></div>';
  const rep = $('#impRep'), bar = $('#impBar');
  const lines = [];
  const log = {
    skip: (name, why) => { lines.push('<div><b>' + esc(name) + '</b>: skipped, ' + esc(why) + '.</div>'); rep.innerHTML = lines.join(''); },
    done: (name, kind, days, fields, ignored, n) => {
      const dl = Array.from(days).sort(); const uniq = Array.from(new Set(fields));
      S.sources.push({ id: uid(), at: Date.now(), file: name, kind, days: days.size, from: dl[0], to: dl[dl.length-1], fields: uniq, ignored });
      lines.push('<div><b>' + esc(name) + '</b> → ' + esc(SOURCES[kind].name) + ': ' + days.size + ' days (' + esc(dl[0] ? fmtDay(dl[0]) + ' to ' + fmtDay(dl[dl.length-1]) : '') + '), ' + n.toLocaleString() + ' values.<br>Read: ' + uniq.map(f => '<span class="k">' + esc(METRICS[f].label) + '</span>').join('') + (ignored.length ? '<br>Ignored columns: ' + ignored.map(x => '<span class="k x">' + esc(x) + '</span>').join('') : '') + '</div>');
      rep.innerHTML = lines.join('');
    }
  };
  const handleText = async (name, text) => {
    const lower = name.toLowerCase();
    if (lower.endsWith('.xml')) { if (/<HealthData/.test(text.slice(0, 4000))) await importAppleXML(name, text, log, p => { bar.style.width = Math.round(p*100) + '%'; }); else log.skip(name, 'not an Apple Health export'); }
    else if (lower.endsWith('.json')) { try { importOuraJSON(name, JSON.parse(text), log); } catch (e) { log.skip(name, 'not valid JSON'); } }
    else if (lower.endsWith('.csv') || lower.endsWith('.txt') || lower.endsWith('.tsv')) importCSV(name, text, log);
    else log.skip(name, 'unsupported type');
  };
  for (const file of files) {
    try {
      if (/\.zip$/i.test(file.name)) {
        if (!window.JSZip) { log.skip(file.name, 'ZIP support did not load (no connection?). Unzip it and import the files inside'); continue; }
        const zip = await JSZip.loadAsync(file);
        const names = Object.keys(zip.files).filter(n => !zip.files[n].dir && !/__MACOSX|\/\./.test(n) && /\.(csv|json|xml|txt|tsv)$/i.test(n));
        if (!names.length) log.skip(file.name, 'no CSV, JSON or XML inside');
        for (const n of names) {
          if (/export_cda\.xml$/i.test(n)) continue; /* Apple's clinical document duplicate */
          rep.innerHTML = lines.join('') + '<div>Reading ' + esc(n) + '…</div>';
          const text = await zip.files[n].async('string');
          await handleText(n.split('/').pop(), text);
        }
      } else {
        if (file.size > 400e6) { log.skip(file.name, 'over 400 MB. Import the Apple Health export on a computer, or unzip it first'); continue; }
        rep.innerHTML = lines.join('') + '<div>Reading ' + esc(file.name) + '…</div>';
        await handleText(file.name, await file.text());
      }
    } catch (e) { log.skip(file.name, 'could not be read (' + (e && e.message ? e.message : 'error') + ')'); }
  }
  endImportAccumulators();
  bar.style.width = '100%';
  save();
  const keep = out.innerHTML;
  render();
  const out2 = $('#importOut'); if (out2) out2.innerHTML = keep.replace('Importing…', 'Import finished');

  $('#fileIn').value = '';
}
function dropSource(kind){

/* ---------- cloud (claude.ai artifact runtime): sync, guidance, downloads ---------- */
const cloud = { on: false, db: null, sample: undefined, downloads: null, saving: false, feed: null, config: null };
const DOC = 'vitalog/state';
async function cloudInit(){
  if (!window.claude || typeof window.claude.use !== 'function') { cloud.sample = null; return; }
  try {
    const [db, sample, downloads] = await Promise.all([claude.use('db'), claude.use('sample'), claude.use('downloads')]);
    cloud.sample = sample || null; cloud.downloads = downloads || null;
    if (db) {
      cloud.db = db;
      try {
        const snap = await db.doc(DOC).get();
        const remote = snap && snap.exists ? snap.data() : null;
        if (remote && remote.v === 1 && (remote.savedAt || 0) > (S.savedAt || 0)) {
          S = normalize(JSON.parse(JSON.stringify(remote)));
          try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
        } else if (!remote || (S.savedAt || 0) > (remote.savedAt || 0)) { cloudSave(); }
        cloud.on = true;
        const feedRef = db.doc('vitalog/feed'), cfgRef = db.doc('vitalog/config');
        try { const fs = await feedRef.get(); cloud.feed = fs && fs.exists ? fs.data() : null; } catch (e) {}
        try { const cs = await cfgRef.get(); cloud.config = cs && cs.exists ? cs.data() : null; } catch (e) {}
        feedRef.onSnapshot(s => { cloud.feed = s && s.exists ? s.data() : null; render(); }, () => {});
        cfgRef.onSnapshot(s => { cloud.config = s && s.exists ? s.data() : null; render(); }, () => {});
        db.doc(DOC).onSnapshot(s => {
          const r = s && s.exists ? s.data() : null;
          if (r && r.v === 1 && (r.savedAt || 0) > (S.savedAt || 0) && !cloud.saving) { S = normalize(JSON.parse(JSON.stringify(r))); try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} render(); }
        }, () => {});
      } catch (e) { cloud.on = false; }
    }
  } catch (e) { if (cloud.sample === undefined) cloud.sample = null; }
  render();
}
let cloudTimer = null;
function cloudSave(){
  if (!cloud.db) return;
  clearTimeout(cloudTimer);
  cloudTimer = setTimeout(async () => {
    cloud.saving = true;
    try { await cloud.db.doc(DOC).set(JSON.parse(JSON.stringify(S))); cloud.on = true; }
    catch (e) {
      cloud.on = false;
      if (e && /large|size|limit|invalid/i.test(e.code + ' ' + e.message)) toast('Too much data to sync to claude.ai. Local copy is safe.');
    }
    cloud.saving = false;
    const el = $('#syncState'); if (el) { el.className = 'sync' + (cloud.on ? ' on' : ''); el.innerHTML = '<i></i>' + (cloud.on ? 'Synced' : 'On this device'); }
  }, 1200);
}

    put(k, 'sleepScore', clamp(Math.round(55 + hours*4 + (rnd()-0.5)*14), 40, 96));
    put(k, 'readiness', clamp(Math.round(58 + hours*3 + (rnd()-0.5)*16), 40, 95));
    put(k, 'hrv', Math.round(34 + hours*2 + (rnd()-0.5)*12));
    put(k, 'rhr', Math.round(64 - hours*0.6 + (rnd()-0.5)*5));
    put(k, 'steps', Math.round(4000 + rnd()*7000 + (wd === 6 ? 2500 : 0)));
    put(k, 'activeCal', Math.round(250 + rnd()*350));
    put(k, 'myairScore', clamp(Math.round(78 + hours*2 + (rnd()-0.5)*14), 50, 100));
    put(k, 'cpapHours', round(Math.min(hours, 5.5 + rnd()*2.2), 1));
    put(k, 'ahi', round(0.6 + rnd()*2.4, 1));
    put(k, 'leak', Math.round(4 + rnd()*14));
    if (i % 3 !== 1) { put(k, 'calories', Math.round(1750 + rnd()*700)); put(k, 'protein', Math.round(90 + rnd()*60)); put(k, 'carbs', Math.round(160 + rnd()*110)); put(k, 'fat', Math.round(55 + rnd()*40)); put(k, 'fiber', Math.round(14 + rnd()*16)); put(k, 'sodium', Math.round(1800 + rnd()*1400)); }
    if (i % 4 === 0) { put(k, 'weightKg', kg); put(k, 'bodyFat', bf); put(k, 'muscleKg', round(kg * (0.41 + rnd()*0.01), 1)); }
    /* manual entries */
    if (rnd() < 0.6) state.entries.push({ id:uid(), type:'weight', ts:ts(k,7,10), kg:round(kg,1), note:'', demo:true });
    const sys = Math.round(122 + (rnd()-0.5)*14 - i*0.15), dia = Math.round(79 + (rnd()-0.5)*10 - i*0.1);
    if (rnd() < 0.8) state.entries.push({ id:uid(), type:'bp', ts:ts(k,7,20), sys, dia, pulse:Math.round(64 + rnd()*10), note:'', demo:true });
    const glasses = 4 + Math.floor(rnd()*6);
    for (let g = 0; g < glasses; g++) state.entries.push({ id:uid(), type:'water', ts:ts(k, 8 + g*1.6, 0), ml:250, note:'', demo:true });
    if (rnd() < 0.5) state.entries.push({ id:uid(), type:'exercise', ts:ts(k,18,0), kind: ['Walk','Run','Strength','Cycle'][Math.floor(rnd()*4)], minutes: 20 + Math.floor(rnd()*40), intensity:['Light','Moderate','Hard'][Math.floor(rnd()*3)], note:'', demo:true });
    if (rnd() < 0.7) state.entries.push({ id:uid(), type:'journal', ts:ts(k,21,30), mood: clamp(Math.round(2.5 + hours/4 + (rnd()-0.5)*2), 1, 5), energy: clamp(Math.round(2 + hours/3 + (rnd()-0.5)), 1, 5), pain: rnd() < 0.3 ? Math.floor(rnd()*5) : 0, symptoms: rnd() < 0.25 ? ['Headache'] : [], note: i === 3 ? 'Slept badly, long day at work.' : '', demo:true });
    if (i > 0) {
      const d = {};
      meds.forEach(m => m.times.forEach(tm => { if (rnd() < 0.9) d[m.id + '|' + tm] = ts(k, +tm.slice(0,2), +tm.slice(3) + Math.floor(rnd()*20)); }));
      state.doses[k] = d;
    }
  }
  state.entries = state.entries.filter(e => !(dayKey(e.ts) === t && (e.type === 'exercise' || e.type === 'journal')));
  /* today's food is not in yet, last night's sleep and CPAP are (they land in the morning) */
  ['calories','protein','carbs','fat','fiber','sodium'].forEach(f => { const d = state.daily[t]; if (d) { delete d[f]; delete d._s[f]; } });
  state.sources.push({ id:'demo-s1', at: Date.now() - 864e5, file:'oura-trends-example.csv', kind:'demo', days:28, fields:['sleepScore','readiness','hrv','rhr','sleepHours','steps'], ignored:[] });
  state.settings.demo = true;
}
function mulberry(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function clearDemo(){
  S.entries = S.entries.filter(e => !e.demo);
  const demoIds = new Set(S.meds.filter(m => m.demo).map(m => m.id));
  S.meds = S.meds.filter(m => !m.demo);
  Object.keys(S.doses).forEach(k => { Object.keys(S.doses[k]).forEach(dk => { if (demoIds.has(dk.split('|')[0])) delete S.doses[k][dk]; }); if (!Object.keys(S.doses[k]).length) delete S.doses[k]; });
  Object.keys(S.daily).forEach(day => { const d = S.daily[day]; Object.keys(d._s || {}).forEach(f => { if (d._s[f] === 'demo') { delete d[f]; delete d._s[f]; } }); if (!Object.keys(d).filter(k => k[0] !== '_').length) delete S.daily[day]; });
  S.sources = S.sources.filter(s => s.kind !== 'demo');
  S.settings.demo = false; save(); render(); toast('Example data cleared. It is all yours now.');
}

/* ---------- reminders ---------- */
const notified = new Set();
function checkReminders(){
  if (!S.settings.notify || !('Notification' in window) || Notification.permission !== 'granted') return;
  const t = today(), now = fmtTime(Date.now());
  S.meds.filter(m => m.active !== false).forEach(m => (m.times || []).forEach(tm => {
    const k = m.id + '|' + tm, nk = t + '|' + k;
    if (tm > now || (S.doses[t] || {})[k] || notified.has(nk)) return;
    const mins = (+now.slice(0,2)*60 + +now.slice(3)) - (+tm.slice(0,2)*60 + +tm.slice(3));
    if (mins > 30) { notified.add(nk); return; }
    notified.add(nk);
    try { new Notification('Time for ' + m.name, { body: (m.dose ? m.dose + ' · ' : '') + 'scheduled ' + tm, tag: nk }); } catch (e) {}
  }));
}
setInterval(checkReminders, 30000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) { render(); checkReminders(); } });

/* ---------- events ---------- */
function bindView(root){ bindCharts(root); }
document.addEventListener('click', ev => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act;
  if (a === 'tab') { tab = b.dataset.tab; render(); window.scrollTo(0,0); }
  else if (a === 'log') logForm(b.dataset.type);
  else if (a === 'water') { S.entries.push({ id:uid(), type:'water', ts:Date.now(), ml:S.settings.glass, note:'' }); save(); render(); toast('+' + S.settings.glass + ' ml'); }
  else if (a === 'dose') {
    const t = today(); S.doses[t] = S.doses[t] || {};
    if (S.doses[t][b.dataset.key]) delete S.doses[t][b.dataset.key]; else S.doses[t][b.dataset.key] = Date.now();
    save(); render();
  }
  else if (a === 'del') { const e = S.entries.find(x => x.id === b.dataset.id); if (e && confirm('Delete this ' + TYPES[e.type].label.toLowerCase() + ' entry?')) { S.entries = S.entries.filter(x => x.id !== b.dataset.id); save(); render(); } }
  else if (a === 'addMed') medForm(null);
  else if (a === 'editMed') medForm(b.dataset.id);
  else if (a === 'hfilter') { histFilter = b.dataset.f; render(); }
  else if (a === 'range') { range = +b.dataset.n; render(); }
  else if (a === 'clearDemo') clearDemo();
  else if (a === 'pickFile') $('#fileIn').click();
  else if (a === 'dropSource') { if (confirm('Remove every value imported from ' + SOURCES[b.dataset.kind].name + '? Entries you typed in stay.')) dropSource(b.dataset.kind); }
  else if (a === 'guide') askGuide(b.dataset.kind);
  else if (a === 'ouraConnect') ouraSheet();
  else if (a === 'delGuide') { S.guidance = S.guidance.filter(g => g.id !== b.dataset.id); save(); render(); }
  else if (a === 'copySummary') { const txt = buildPrompt('daily'); navigator.clipboard.writeText(txt).then(() => toast('Summary copied. Paste it into Claude.'), () => toast('Could not copy on this browser.')); }
});
$$('.tab').forEach(b => b.addEventListener('click', () => { tab = b.dataset.tab; render(); window.scrollTo(0,0); }));
$('#btnSettings').addEventListener('click', settingsSheet);
$('#btnHistory').addEventListener('click', () => { tab = 'history'; render(); window.scrollTo(0,0); });
document.addEventListener('keydown', ev => { if (ev.key === 'Escape') closeSheet(); });

let toastT;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2600); }

/* ---------- offline ---------- */
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol) && !/claude\.ai$/.test(location.hostname)) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}

render();
checkReminders();
cloudInit();
})();
